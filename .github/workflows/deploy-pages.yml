name: Build and deploy MilkFlow to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript verification
        run: bun run lint

      - name: Build static frontend
        run: bun run build:pages

      - name: Validate static artifact and personal-data isolation
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/.nojekyll
          test ! -f data/milkflow_cloud_database.json
          if grep -RIlE 'fam_1786815802222_lu7tvw|641306|poagmqrrbscemlqqccfe|eyJhbGciOiJIUzI1Ni' dist; then
            echo 'Built site contains old family identifiers or embedded database keys'
            exit 1
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static app
        id: deployment
        uses: actions/deploy-pages@v4
